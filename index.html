<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Via live</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#f4f5f7; --card:#ffffffee; --fg:#14161a; --muted:#5f6670; --accent:#ff5a2c; --ok:#1e9e5a; --warn:#d98a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111316; --card:#1c1f24ee; --fg:#eef0f3; --muted:#a2a9b3; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position:fixed; inset:0; }
  .card { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); max-width:460px; margin:0 auto;
          background:var(--card); backdrop-filter:blur(8px); border-radius:20px; padding:14px 16px; box-shadow:0 6px 24px #0003; }
  .status { display:flex; align-items:center; gap:8px; font-weight:600; font-size:17px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.rec { background:#ff3b30; animation:blink 1.6s infinite; } .dot.auto { background:var(--warn); }
  @keyframes blink { 50% { opacity:.3 } }
  .stats { display:flex; gap:18px; margin-top:8px; font-variant-numeric:tabular-nums; }
  .stats div span { display:block; font-size:12px; color:var(--muted); }
  .note { margin-top:8px; font-size:13px; color:var(--muted); }
  button { position:fixed; left:12px; top:calc(56px + env(safe-area-inset-top)); border:0; border-radius:14px; padding:10px 14px;
           background:var(--card); color:var(--fg); font:inherit; font-weight:600; box-shadow:0 4px 16px #0003; }
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom:auto; top:0; }
</style>
</head>
<body>
<div id="map"></div>
<button id="center" hidden>Center</button>
<div class="card" aria-live="polite">
  <div class="status"><span class="dot" id="dot"></span><span id="title">Loading…</span></div>
  <div class="stats" id="stats" hidden>
    <div><span>Last position</span><b id="ago">–</b></div>
    <div><span>Distance</span><b id="dist">–</b></div>
    <div><span>Elapsed</span><b id="elapsed">–</b></div>
    <div><span>Battery</span><b id="bat">–</b></div>
  </div>
  <div class="note" id="note">Location updates arrive every 5–10 minutes while recording.</div>
</div>
<script>
// Link: #<ntfy topic>.<base64url AES-256 key>. The fragment never leaves the browser.
const [topic, keyText] = location.hash.slice(1).split(".");
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const PHASES = { rec: ["Recording", "rec"], auto: ["Auto-paused (not moving)", "auto"], paused: ["Paused", ""], stopped: ["Activity ended", ""] };

let key, latest = null, points = new Map(), map, ready = false, fitted = false;

async function open(text) {
  try {
    const raw = b64(text.trim());
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  } catch { return null; } // not ours or tampered: ignore
}

async function onMessage(m) {
  if (m.event !== "message" || !m.message) return;
  const u = await open(m.message);
  if (!u || u.v !== 1) return;
  u.at = m.time * 1000;
  // Show only the newest activity.
  if (!latest || u.st > latest.st) { latest = u; points = new Map(); }
  else if (u.st < latest.st) return;
  else if (u.at >= latest.at) latest = u;
  for (const p of u.p) points.set(p[0], p);
  render();
}

function fmtDur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}

function render() {
  if (!latest) return;
  const [title, cls] = PHASES[latest.ph] || PHASES.rec;
  const pts = [...points.values()].sort((a, b) => a[0] - b[0]);
  const last = pts[pts.length - 1];
  $("title").textContent = title;
  $("dot").className = "dot " + cls;
  $("stats").hidden = false;
  $("ago").textContent = last ? (Date.now() - last[0] < 60000 ? "just now" : fmtDur(Date.now() - last[0]) + " ago") : "–";
  $("dist").textContent = (latest.d / 1000).toFixed(2) + " km";
  $("elapsed").textContent = latest.ph === "stopped" ? "–" : fmtDur(Date.now() - latest.st);
  $("bat").textContent = latest.bat > 0 ? latest.bat + "%" : "–";
  $("note").textContent = latest.ph === "stopped"
    ? "Sharing ended. This page shows the last known route."
    : "Location updates arrive every 5–10 minutes while recording. This page refreshes on its own.";
  if (!ready || !pts.length) return;
  const line = pts.map(p => [p[2], p[1]]);
  map.getSource("route").setData({ type: "Feature", geometry: { type: "LineString", coordinates: line } });
  map.getSource("here").setData({ type: "Feature", geometry: { type: "Point", coordinates: line[line.length - 1] } });
  $("center").hidden = false;
  if (!fitted) { fit(line); fitted = true; }
}

function fit(line) {
  const b = line.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(line[0], line[0]));
  map.fitBounds(b, { padding: { top: 60, left: 40, right: 40, bottom: 180 }, maxZoom: 16, duration: 0 });
}

async function start() {
  map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty", center: [0, 20], zoom: 1.5, attributionControl: { compact: true } });
  if (!topic || !keyText) { $("title").textContent = "This link is incomplete"; $("note").textContent = "Ask for the full link from the Via app."; return; }
  try { key = await crypto.subtle.importKey("raw", b64(keyText), "AES-GCM", false, ["decrypt"]); }
  catch { $("title").textContent = "This link is incomplete"; return; }
  map.on("load", () => {
    map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addSource("here", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "casing", type: "line", source: "route", paint: { "line-color": "#fff", "line-width": 7.5 }, layout: { "line-cap": "round", "line-join": "round" } });
    map.addLayer({ id: "route", type: "line", source: "route", paint: { "line-color": "#ff5a2c", "line-width": 4.5 }, layout: { "line-cap": "round", "line-join": "round" } });
    map.addLayer({ id: "halo", type: "circle", source: "here", paint: { "circle-radius": 18, "circle-color": "#ff5a2c", "circle-opacity": 0.2 } });
    map.addLayer({ id: "here", type: "circle", source: "here", paint: { "circle-radius": 8, "circle-color": "#ff5a2c", "circle-stroke-color": "#fff", "circle-stroke-width": 3 } });
    ready = true;
    render();
  });
  $("center").onclick = () => { const p = [...points.values()].sort((a, b) => a[0] - b[0]); if (p.length) map.easeTo({ center: [p.at(-1)[2], p.at(-1)[1]], zoom: Math.max(map.getZoom(), 15) }); };

  const base = "https://ntfy.sh/" + encodeURIComponent(topic);
  try {
    const text = await (await fetch(base + "/json?poll=1&since=12h")).text();
    for (const l of text.split("\n")) if (l) await onMessage(JSON.parse(l));
  } catch { $("note").textContent = "Couldn't load updates. Check your connection; the page keeps trying."; }
  if (!latest) { $("title").textContent = "No recent activity"; $("note").textContent = "Nothing shared in the last 12 hours. This page updates when recording starts."; }
  new EventSource(base + "/sse").onmessage = e => onMessage(JSON.parse(e.data));
  setInterval(render, 30000);
}
start();
</script>
</body>
</html>
